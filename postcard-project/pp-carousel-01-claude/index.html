<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postcard Carousel</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <p class="flip-hint">Click a postcard to rotate it | Use arrows to spin carousel</p>

    <!-- 3D Carousel -->
    <div class="carousel-container" id="carouselContainer">
        <div class="carousel-track" id="carouselTrack">
            <div class="carousel-slide" data-index="0">
                <div class="flip-card" data-rotation="0">
                    <div class="flip-card-inner">
                        <div class="flip-card-front">
                            <img src="images/01-IMG_1468-Enhanced-NR.jpg" alt="Postcard 1 Front">
                        </div>
                        <div class="flip-card-back">
                            <img src="images/backs/01-backArtboard%201.jpg" alt="Postcard 1 Back">
                        </div>
                    </div>
                </div>
            </div>
            <div class="carousel-slide" data-index="1">
                <div class="flip-card" data-rotation="0">
                    <div class="flip-card-inner">
                        <div class="flip-card-front">
                            <img src="images/02-51382854932_29158e260e_o.jpg" alt="Postcard 2 Front">
                        </div>
                        <div class="flip-card-back">
                            <img src="images/backs/02-backArtboard%201.jpg" alt="Postcard 2 Back">
                        </div>
                    </div>
                </div>
            </div>
            <div class="carousel-slide" data-index="2">
                <div class="flip-card" data-rotation="0">
                    <div class="flip-card-inner">
                        <div class="flip-card-front">
                            <img src="images/03-029390-201127-Kuaui-All-IMG_1808.jpg" alt="Postcard 3 Front">
                        </div>
                        <div class="flip-card-back">
                            <img src="images/backs/03-backArtboard%201.jpg" alt="Postcard 3 Back">
                        </div>
                    </div>
                </div>
            </div>
            <div class="carousel-slide" data-index="3">
                <div class="flip-card" data-rotation="0">
                    <div class="flip-card-inner">
                        <div class="flip-card-front">
                            <img src="images/04-IMG_3156-Enhanced-NR.jpg" alt="Postcard 4 Front">
                        </div>
                        <div class="flip-card-back">
                            <img src="images/backs/04-backArtboard%201.jpg" alt="Postcard 4 Back">
                        </div>
                    </div>
                </div>
            </div>
            <div class="carousel-slide" data-index="4">
                <div class="flip-card" data-rotation="0">
                    <div class="flip-card-inner">
                        <div class="flip-card-front">
                            <img src="images/05-IMG_9581-Enhanced-NR.jpg" alt="Postcard 5 Front">
                        </div>
                        <div class="flip-card-back">
                            <img src="images/backs/05-backArtboard%201.jpg" alt="Postcard 5 Back">
                        </div>
                    </div>
                </div>
            </div>
            <div class="carousel-slide" data-index="5">
                <div class="flip-card" data-rotation="0">
                    <div class="flip-card-inner">
                        <div class="flip-card-front">
                            <img src="images/06-016978-070119-32-Summer-Spring-May-June-CVPR-LA-LACMA-LongBeach-Seattle_100EOS7D-IMG_5130.jpg" alt="Postcard 6 Front">
                        </div>
                        <div class="flip-card-back">
                            <img src="images/backs/06-backArtboard%201.jpg" alt="Postcard 6 Back">
                        </div>
                    </div>
                </div>
            </div>
            <div class="carousel-slide" data-index="6">
                <div class="flip-card" data-rotation="0">
                    <div class="flip-card-inner">
                        <div class="flip-card-front">
                            <img src="images/07-007927-122618-32-sep-oct-nov-ny-beyonce-oregon-cbre-seattle_100EOS5D-IMG_9677.jpg" alt="Postcard 7 Front">
                        </div>
                        <div class="flip-card-back">
                            <img src="images/backs/07-backArtboard%201.jpg" alt="Postcard 7 Back">
                        </div>
                    </div>
                </div>
            </div>
            <div class="carousel-slide" data-index="7">
                <div class="flip-card" data-rotation="0">
                    <div class="flip-card-inner">
                        <div class="flip-card-front">
                            <img src="images/08-d003d200-4faf-40a6-be05-2907b8044036.jpg" alt="Postcard 8 Front">
                        </div>
                        <div class="flip-card-back">
                            <img src="images/backs/08-backArtboard%201.jpg" alt="Postcard 8 Back">
                        </div>
                    </div>
                </div>
            </div>
            <div class="carousel-slide" data-index="8">
                <div class="flip-card" data-rotation="0">
                    <div class="flip-card-inner">
                        <div class="flip-card-front">
                            <img src="images/09-2408-5x7_joesantiago-01.jpg" alt="Postcard 9 Front">
                        </div>
                        <div class="flip-card-back">
                            <img src="images/backs/09-backArtboard%201.jpg" alt="Postcard 9 Back">
                        </div>
                    </div>
                </div>
            </div>
            <div class="carousel-slide" data-index="9">
                <div class="flip-card" data-rotation="0">
                    <div class="flip-card-inner">
                        <div class="flip-card-front">
                            <img src="images/10-_MG_9930-Enhanced-NR.jpg" alt="Postcard 10 Front">
                        </div>
                        <div class="flip-card-back">
                            <img src="images/backs/10-backArtboard%201.jpg" alt="Postcard 10 Back">
                        </div>
                    </div>
                </div>
            </div>
            <div class="carousel-slide" data-index="10">
                <div class="flip-card" data-rotation="0">
                    <div class="flip-card-inner">
                        <div class="flip-card-front">
                            <img src="images/11-IMG_1578.jpg" alt="Postcard 11 Front">
                        </div>
                        <div class="flip-card-back">
                            <img src="images/backs/11-backArtboard%201.jpg" alt="Postcard 11 Back">
                        </div>
                    </div>
                </div>
            </div>
            <div class="carousel-slide" data-index="11">
                <div class="flip-card" data-rotation="0">
                    <div class="flip-card-inner">
                        <div class="flip-card-front">
                            <img src="images/12-026176-200927-32-COVID-TIMES_COLORADO-NEW-MEXICO_100EOS5D-IMG_4107.jpg" alt="Postcard 12 Front">
                        </div>
                        <div class="flip-card-back">
                            <img src="images/backs/12-backArtboard%201.jpg" alt="Postcard 12 Back">
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <button class="carousel-btn prev-btn" id="prevBtn">&lt;</button>
        <button class="carousel-btn next-btn" id="nextBtn">&gt;</button>
    </div>

    <div class="carousel-dots" id="carouselDots"></div>
    <p class="rotation-hint" id="rotationHint">Click to rotate 45° | Press Escape to return to carousel</p>

    <script src="js/carousel.js"></script>
</body>
</html>
